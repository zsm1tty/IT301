<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab6: Flexbox</title>

    <style>
        *{
            box-sizing: border-box;
        }

        .flex-parent{
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="flex-parent">
        <img class="child1" src="https://picsum.photos/200/200?random=1" alt="Random pic 1">
        <img class="child2" src="https://picsum.photos/300/300?random=2" alt="Random pic 2">
        <img class="child3" src="https://picsum.photos/200/200?random=3" alt="Random pic 3">
    </div>
</body>
</html>
