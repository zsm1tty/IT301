<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab7: Masonry</title>
        
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                display: flex;
                height: 100vh;
            }
            #left_parent {
                width: 70px;
                height: 100vh;
                flex-shrink: 0;
                background-color: #f27324;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                padding: 20px;
            }
            .icon-group {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                gap: 20px;
            }
            .icon {
                font-size: 30px;
                line-height: 1;
            }
            #right_parent {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                flex-grow: 1;
                height: 100vh;
                overflow-y: auto;
                align-content: flex-start;
                gap: 4px;
                padding: 4px;
            }
            .child {
                height: 100px;
                flex-grow: 1;
                object-fit: cover;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <div id = "left_parent">
            <div class= "icon-group">
                <div class = "icon">&#x1F4F7;</div>
                <div class = "icon">&#x1F5C4;&#xfe0f;</div>
                <div class = "icon">&#x2764;&#xfe0f;</div>
            </div>
            <div class = "icon">&#x1F5D1;&#xfe0f;</div>
        </div>

        <div id="right_parent">
